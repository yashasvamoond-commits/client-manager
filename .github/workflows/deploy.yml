name: Build NyayaDesk Android APK & Universal Installer Release

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies & build NyayaDesk web bundle
        run: |
          npm ci
          npm run build

      - name: Generate Native Android Project & Build Installable APK
        run: |
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../NyayaDesk-Android.apk

      - name: Create Universal Download Page & ZIP Bundle
        run: |
          cd dist && zip -qr ../NyayaDesk-Universal-Offline-App.zip . && cd ..

      - name: Publish Permanent GitHub Release with Direct Download Links
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          target_commitish: ${{ github.sha }}
          name: "NyayaDesk v1.0.1 — Direct Install for iPhone (iOS) & Android"
          body: |
            ## ⚖️ NyayaDesk — Direct Install for iPhone (iOS) & Android

            ### 🍏 iPhone / iPad (iOS Safari — 1-Tap Open & Add to Home Screen)
            👉 **[Tap Here to Open NyayaDesk on iPhone / iPad](https://raw.githack.com/${{ github.repository }}/arena/df2a2b26-client-manager/NyayaDesk-Standalone.html)**
            1. Tap the link above in **Safari** on your iPhone.
            2. Tap the **Share icon (`↑`)** at the bottom of Safari → scroll down and tap **"Add to Home Screen"** → tap **"Add"**.

            ---

            ### 📱 Android Phone / Tablet (Direct 1-Tap Native App `.apk`)
            👉 **[Tap Here to Download NyayaDesk-Android.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.1/NyayaDesk-Android.apk)**
            1. Tap the link above on your Android phone.
            2. Once downloaded, tap **Open** → **Install** (if prompted, tap *Allow from this source*).
            3. Open **NyayaDesk** from your home screen — works **100% offline** with all 12,238 Bare Act sections & IPC/BNS/CrPC/BNSS/IEA/BSA converter!
          draft: false
          prerelease: false
          files: |
            NyayaDesk-Android.apk
            NyayaDesk-Standalone.html
            NyayaDesk-Universal-Offline-App.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
